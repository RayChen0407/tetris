<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄羅斯方塊</title>
<style>
  :root {
    --bg: #14121f;
    --panel: #1c1930;
    --panel-line: #322c4d;
    --ink: #ece8ff;
    --dim: #8b84ae;
    --accent: #ffb84d;
    --accent-dim: #7a5a2e;
    --board-bg: #0c0a16;
    --grid-line: #211e35;

    --c-I: #4dd8ff;
    --c-O: #ffd84d;
    --c-T: #c084fc;
    --c-S: #5ce6a6;
    --c-Z: #ff6b6b;
    --c-J: #5c8dff;
    --c-L: #ff9d4d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', 'Courier New', ui-monospace, monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    display: grid;
    grid-template-columns: auto 220px;
    gap: 28px;
    align-items: start;
  }

  .title {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 4px;
  }

  .title h1 {
    font-size: 22px;
    letter-spacing: 0.04em;
    margin: 0;
    font-weight: 700;
  }

  .title .sub {
    color: var(--dim);
    font-size: 12px;
  }

  .board-frame {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 10px;
  }

  canvas#board {
    display: block;
    background: var(--board-bg);
    border-radius: 3px;
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 14px;
  }

  .panel h2 {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin: 0 0 10px;
    font-weight: 500;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }

  .stat-row span:last-child {
    color: var(--accent);
    font-weight: 700;
  }

  canvas#next {
    display: block;
    background: var(--board-bg);
    border-radius: 3px;
    margin: 0 auto;
  }

  .keys {
    font-size: 12px;
    color: var(--dim);
    line-height: 1.9;
  }

  .keys b {
    color: var(--ink);
    font-weight: 700;
  }

  .msg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(12, 10, 22, 0.86);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    border-radius: 3px;
  }

  .msg-overlay.show { display: flex; }

  .msg-overlay .big {
    font-size: 18px;
    letter-spacing: 0.04em;
    font-weight: 700;
  }

  .msg-overlay .small {
    font-size: 12px;
    color: var(--dim);
  }

  .board-wrap { position: relative; }

  button.startbtn {
    margin-top: 4px;
    background: var(--accent);
    color: #1c1930;
    border: none;
    padding: 8px 16px;
    font-family: inherit;
    font-weight: 700;
    font-size: 12px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  button.startbtn:hover { opacity: 0.88; }

  @media (max-width: 620px) {
    .wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="title">
    <h1>俄羅斯方塊</h1>
    <span class="sub">TETRIS</span>
  </div>

  <div class="board-wrap">
    <div class="board-frame">
      <canvas id="board" width="300" height="600"></canvas>
    </div>
    <div class="msg-overlay" id="overlay">
      <div class="big" id="overlayText">準備好了嗎？</div>
      <div class="small" id="overlayHint">方向鍵移動與旋轉，空白鍵硬降</div>
      <button class="startbtn" id="startBtn">開始遊戲</button>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>下一個</h2>
      <canvas id="next" width="120" height="120"></canvas>
    </div>

    <div class="panel">
      <h2>戰績</h2>
      <div class="stat-row"><span>分數</span><span id="score">0</span></div>
      <div class="stat-row"><span>消行</span><span id="lines">0</span></div>
      <div class="stat-row"><span>等級</span><span id="level">1</span></div>
    </div>

    <div class="panel">
      <h2>操作方式</h2>
      <div class="keys">
        <div><b>← →</b> 左右移動</div>
        <div><b>↓</b> 加速下降</div>
        <div><b>↑</b> 旋轉</div>
        <div><b>空白鍵</b> 硬降</div>
        <div><b>P</b> 暫停</div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const COLS = 10, ROWS = 20, CELL = 30;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const overlayHint = document.getElementById('overlayHint');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');

  const COLORS = {
    I: getComputedStyle(document.documentElement).getPropertyValue('--c-I').trim(),
    O: getComputedStyle(document.documentElement).getPropertyValue('--c-O').trim(),
    T: getComputedStyle(document.documentElement).getPropertyValue('--c-T').trim(),
    S: getComputedStyle(document.documentElement).getPropertyValue('--c-S').trim(),
    Z: getComputedStyle(document.documentElement).getPropertyValue('--c-Z').trim(),
    J: getComputedStyle(document.documentElement).getPropertyValue('--c-J').trim(),
    L: getComputedStyle(document.documentElement).getPropertyValue('--c-L').trim(),
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
  };

  const TYPES = Object.keys(SHAPES);

  function newGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  let grid = newGrid();
  let current, nextType, bag = [];
  let score = 0, lines = 0, level = 1;
  let dropInterval = 800;
  let dropTimer = 0;
  let lastTime = 0;
  let running = false;
  let paused = false;
  let rafId = null;

  function refillBag() {
    const arr = [...TYPES];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    bag.push(...arr);
  }

  function drawFromBag() {
    if (bag.length === 0) refillBag();
    return bag.shift();
  }

  function makePiece(type) {
    return {
      type,
      cells: SHAPES[type].map(([x, y]) => [x, y]),
      x: 3,
      y: -1,
    };
  }

  function rotateCells(cells, type) {
    if (type === 'O') return cells.map(c => [...c]);
    // rotate around approximate center (index 1 or center of bounding box)
    const cx = 1.5, cy = 1.5;
    return cells.map(([x, y]) => {
      const nx = cy - y + cx - 1.5 + 1.5;
      return [x, y];
    });
  }

  // Proper rotation using bounding-box based matrix rotation
  function rotate(cells) {
    const xs = cells.map(c => c[0]);
    const ys = cells.map(c => c[1]);
    const maxX = Math.max(...xs);
    return cells.map(([x, y]) => [maxX - y, x]);
  }

  function collides(cells, ox, oy) {
    for (const [cx, cy] of cells) {
      const x = ox + cx;
      const y = oy + cy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function spawn() {
    const type = nextType || drawFromBag();
    nextType = drawFromBag();
    current = makePiece(type);
    if (collides(current.cells, current.x, current.y)) {
      gameOver();
    }
    drawNext();
  }

  function lockPiece() {
    for (const [cx, cy] of current.cells) {
      const x = current.x + cx;
      const y = current.y + cy;
      if (y >= 0) grid[y][x] = current.type;
    }
    clearLines();
    spawn();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      dropInterval = Math.max(120, 800 - (level - 1) * 65);
      updateStats();
    }
  }

  function updateStats() {
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  }

  function move(dx) {
    if (!collides(current.cells, current.x + dx, current.y)) {
      current.x += dx;
    }
  }

  function softDrop() {
    if (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
  }

  function hardDrop() {
    let dist = 0;
    while (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      dist++;
    }
    score += dist * 2;
    updateStats();
    lockPiece();
  }

  function tryRotate() {
    const rotated = rotate(current.cells);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(rotated, current.x + k, current.y)) {
        current.cells = rotated;
        current.x += k;
        return;
      }
    }
  }

  function cellColor(type) { return COLORS[type]; }

  function drawCell(c, gx, gy, type, ghost) {
    const px = gx * CELL, py = gy * CELL;
    if (py < -CELL) return;
    c.fillStyle = ghost ? 'rgba(255,255,255,0.06)' : cellColor(type);
    c.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    if (!ghost) {
      c.strokeStyle = 'rgba(0,0,0,0.25)';
      c.lineWidth = 1;
      c.strokeRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3);
      c.fillStyle = 'rgba(255,255,255,0.18)';
      c.fillRect(px + 2, py + 2, CELL - 4, 4);
    }
  }

  function drawGrid() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line').trim();
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(COLS * CELL, y * CELL);
      ctx.stroke();
    }
  }

  function ghostY() {
    let gy = current.y;
    while (!collides(current.cells, current.x, gy + 1)) gy++;
    return gy;
  }

  function draw() {
    drawGrid();
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x], false);
      }
    }
    if (current) {
      const gy = ghostY();
      for (const [cx, cy] of current.cells) {
        drawCell(ctx, current.x + cx, gy + cy, current.type, true);
      }
      for (const [cx, cy] of current.cells) {
        drawCell(ctx, current.x + cx, current.y + cy, current.type, false);
      }
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextType) return;
    const cells = SHAPES[nextType];
    const size = 24;
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const w = (Math.max(...xs) + 1) * size, h = (Math.max(...ys) + 1) * size;
    const ox = (nextCanvas.width - w) / 2, oy = (nextCanvas.height - h) / 2;
    nctx.fillStyle = cellColor(nextType);
    for (const [cx, cy] of cells) {
      nctx.fillRect(ox + cx * size + 1, oy + cy * size + 1, size - 2, size - 2);
    }
  }

  function gameOver() {
    running = false;
    overlayText.textContent = '遊戲結束 — 分數 ' + score;
    overlayHint.textContent = '按 R 或下方按鈕重新開始';
    startBtn.textContent = '再玩一次';
    overlay.classList.add('show');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayText.textContent = '暫停中';
      overlayHint.textContent = '按 P 繼續，或按 R 重新開始';
      startBtn.textContent = '重新開始';
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  }

  function loop(time) {
    if (!running || paused) return;
    const dt = time - lastTime;
    lastTime = time;
    dropTimer += dt;
    if (dropTimer > dropInterval) {
      dropTimer = 0;
      softDrop();
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    grid = newGrid();
    score = 0; lines = 0; level = 1;
    dropInterval = 800;
    dropTimer = 0;
    bag = [];
    nextType = null;
    updateStats();
    overlay.classList.remove('show');
    overlayHint.textContent = '方向鍵移動與旋轉，空白鍵硬降';
    startBtn.textContent = '開始遊戲';
    running = true;
    paused = false;
    spawn();
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') {
      togglePause();
      return;
    }
    if (e.key === 'r' || e.key === 'R') {
      if (running) startGame();
      return;
    }
    if (!running || paused) return;
    switch (e.key) {
      case 'ArrowLeft': move(-1); e.preventDefault(); break;
      case 'ArrowRight': move(1); e.preventDefault(); break;
      case 'ArrowDown': softDrop(); e.preventDefault(); break;
      case 'ArrowUp': tryRotate(); e.preventDefault(); break;
      case ' ': hardDrop(); e.preventDefault(); break;
    }
    draw();
  });

  // initial render
  drawGrid();
  overlay.classList.add('show');
})();
</script>

</body>
</html>
